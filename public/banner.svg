<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1636;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#121E45;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C8102E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E31937;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2DA8D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A8AB5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="yellowAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F4C430;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D4A620;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#navyGrad)"/>

  <!-- Grid pattern overlay -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.3" opacity="0.05"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Red diagonal stripe top-right -->
  <polygon points="700,0 1200,0 1200,200 550,0" fill="url(#redAccent)" opacity="0.9"/>

  <!-- Yellow accent line -->
  <line x1="550" y1="0" x2="700" y2="0" stroke="#F4C430" stroke-width="4"/>
  <line x1="550" y1="0" x2="1200" y2="200" stroke="#F4C430" stroke-width="2" opacity="0.6"/>

  <!-- Red diagonal stripe bottom-left -->
  <polygon points="0,430 0,630 650,630 0,500" fill="url(#redAccent)" opacity="0.7"/>

  <!-- Yellow accent line bottom -->
  <line x1="0" y1="500" x2="650" y2="630" stroke="#F4C430" stroke-width="2" opacity="0.5"/>

  <!-- Decorative dots -->
  <g opacity="0.3">
    <circle cx="50" cy="560" r="2" fill="#2DA8D4"/>
    <circle cx="70" cy="560" r="2" fill="#2DA8D4"/>
    <circle cx="90" cy="560" r="2" fill="#2DA8D4"/>
    <circle cx="110" cy="560" r="2" fill="#2DA8D4"/>
    <circle cx="50" cy="580" r="2" fill="#2DA8D4"/>
    <circle cx="70" cy="580" r="2" fill="#2DA8D4"/>
    <circle cx="90" cy="580" r="2" fill="#2DA8D4"/>
    <circle cx="110" cy="580" r="2" fill="#2DA8D4"/>
    <circle cx="50" cy="600" r="2" fill="#2DA8D4"/>
    <circle cx="70" cy="600" r="2" fill="#2DA8D4"/>
    <circle cx="90" cy="600" r="2" fill="#2DA8D4"/>
    <circle cx="110" cy="600" r="2" fill="#2DA8D4"/>
  </g>

  <!-- Left side: V Logo mark -->
  <g transform="translate(80, 180)">
    <!-- Large V shape -->
    <polygon points="60,0 0,140 30,140 60,70 90,140 120,140" fill="url(#cyanGlow)" opacity="0.9"/>
    <polygon points="65,8 12,132 30,132 60,68 65,55" fill="#1A8AB5" opacity="0.5"/>
  </g>

  <!-- Text: VeriDoc -->
  <text x="220" y="290" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="72" fill="#ffffff">
    Ver<tspan fill="url(#cyanGlow)">i</tspan>Doc
  </text>

  <!-- Tagline -->
  <text x="220" y="330" font-family="Inter, Arial, sans-serif" font-weight="400" font-size="20" fill="#94a3b8">
    Documentos Digitais Verificaveis
  </text>

  <!-- Separator line -->
  <line x1="220" y1="345" x2="420" y2="345" stroke="url(#yellowAccent)" stroke-width="3" opacity="0.8"/>

  <!-- Feature icons area -->
  <!-- Document icon -->
  <g transform="translate(220, 380)">
    <rect width="44" height="44" rx="8" fill="#1e293b" stroke="#2DA8D4" stroke-width="1.5"/>
    <rect x="10" y="8" width="24" height="3" rx="1" fill="#2DA8D4"/>
    <rect x="10" y="15" width="20" height="2" rx="1" fill="#94a3b8"/>
    <rect x="10" y="21" width="22" height="2" rx="1" fill="#94a3b8"/>
    <rect x="10" y="27" width="16" height="2" rx="1" fill="#94a3b8"/>
    <rect x="10" y="33" width="18" height="2" rx="1" fill="#94a3b8"/>
  </g>
  <text x="274" y="410" font-family="Inter, Arial, sans-serif" font-weight="600" font-size="14" fill="#cbd5e1">Emissao</text>

  <!-- Shield icon -->
  <g transform="translate(380, 380)">
    <path d="M22 4 L38 12 L38 28 C38 36 22 42 22 42 C22 42 6 36 6 28 L6 12 Z" fill="none" stroke="#C8102E" stroke-width="1.5"/>
    <polyline points="14,22 20,28 30,16" fill="none" stroke="#C8102E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="434" y="410" font-family="Inter, Arial, sans-serif" font-weight="600" font-size="14" fill="#cbd5e1">Seguranca</text>

  <!-- QR Code icon -->
  <g transform="translate(540, 380)">
    <rect width="44" height="44" rx="8" fill="#1e293b" stroke="#F4C430" stroke-width="1.5"/>
    <rect x="10" y="10" width="10" height="10" fill="#F4C430"/>
    <rect x="12" y="12" width="6" height="6" fill="#1e293b"/>
    <rect x="13" y="13" width="4" height="4" fill="#F4C430"/>
    <rect x="24" y="10" width="10" height="10" fill="#F4C430"/>
    <rect x="26" y="12" width="6" height="6" fill="#1e293b"/>
    <rect x="27" y="13" width="4" height="4" fill="#F4C430"/>
    <rect x="10" y="24" width="10" height="10" fill="#F4C430"/>
    <rect x="12" y="26" width="6" height="6" fill="#1e293b"/>
    <rect x="13" y="27" width="4" height="4" fill="#F4C430"/>
    <rect x="24" y="24" width="3" height="3" fill="#F4C430"/>
    <rect x="29" y="29" width="3" height="3" fill="#F4C430"/>
    <rect x="24" y="31" width="3" height="3" fill="#F4C430"/>
    <rect x="31" y="24" width="3" height="3" fill="#F4C430"/>
    <rect x="34" y="27" width="3" height="3" fill="#F4C430"/>
  </g>
  <text x="594" y="410" font-family="Inter, Arial, sans-serif" font-weight="600" font-size="14" fill="#cbd5e1">Verificacao</text>

  <!-- Right side: Document mockup -->
  <g transform="translate(750, 120)">
    <!-- Laptop base -->
    <rect x="0" y="260" width="380" height="12" rx="4" fill="#1e293b" opacity="0.6"/>

    <!-- Laptop screen -->
    <rect x="20" y="30" width="340" height="230" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>

    <!-- Screen content - Document -->
    <rect x="40" y="50" width="300" height="190" rx="4" fill="#ffffff"/>

    <!-- Document header bar -->
    <rect x="40" y="50" width="300" height="8" rx="4" fill="#C8102E"/>

    <!-- Document logo placeholder -->
    <rect x="60" y="72" width="50" height="18" rx="2" fill="#121E45"/>
    <text x="66" y="85" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="9" fill="#ffffff">V<tspan fill="#2DA8D4">D</tspan></text>

    <!-- Document lines -->
    <rect x="130" y="74" width="180" height="3" rx="1" fill="#e2e8f0"/>
    <rect x="60" y="100" width="260" height="2" rx="1" fill="#cbd5e1"/>
    <rect x="60" y="108" width="240" height="2" rx="1" fill="#cbd5e1"/>
    <rect x="60" y="116" width="250" height="2" rx="1" fill="#cbd5e1"/>
    <rect x="60" y="124" width="200" height="2" rx="1" fill="#cbd5e1"/>

    <!-- QR Code on document -->
    <rect x="60" y="140" width="30" height="30" fill="#121E45"/>
    <rect x="63" y="143" width="10" height="10" fill="#ffffff"/>
    <rect x="65" y="145" width="6" height="6" fill="#121E45"/>
    <rect x="77" y="143" width="10" height="10" fill="#ffffff"/>
    <rect x="79" y="145" width="6" height="6" fill="#121E45"/>
    <rect x="63" y="157" width="10" height="10" fill="#ffffff"/>
    <rect x="65" y="159" width="6" height="6" fill="#121E45"/>
    <rect x="77" y="157" width="5" height="5" fill="#ffffff"/>
    <rect x="85" y="163" width="5" height="5" fill="#ffffff"/>

    <!-- Seal/stamp -->
    <circle cx="290" cy="210" r="18" fill="none" stroke="#F4C430" stroke-width="2"/>
    <circle cx="290" cy="210" r="12" fill="none" stroke="#F4C430" stroke-width="1"/>
    <text x="282" y="214" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="8" fill="#F4C430">OK</text>

    <!-- Signature line -->
    <line x1="200" y1="220" x2="320" y2="220" stroke="#94a3b8" stroke-width="0.5"/>
    <text x="240" y="232" font-family="Inter, Arial, sans-serif" font-size="6" fill="#94a3b8">Assinatura Digital</text>
  </g>

  <!-- Shield overlay on laptop -->
  <g transform="translate(1020, 130)" opacity="0.4">
    <path d="M30 0 L55 12 L55 38 C55 50 30 60 30 60 C30 60 5 50 5 38 L5 12 Z" fill="none" stroke="#2DA8D4" stroke-width="2"/>
    <polyline points="18,30 26,38 40,22" fill="none" stroke="#2DA8D4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Angola silhouette (simplified) -->
  <g transform="translate(780, 380)" opacity="0.15">
    <path d="M0,0 C5,-15 15,-25 25,-30 C35,-35 45,-30 55,-20 C60,-15 65,-5 60,5 C55,15 45,20 35,25 C25,30 15,25 10,15 C5,5 0,5 0,0 Z" fill="#F4C430"/>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="590" width="1200" height="40" fill="#0D1636" opacity="0.8"/>
  <line x1="0" y1="590" x2="1200" y2="590" stroke="#F4C430" stroke-width="1" opacity="0.4"/>

  <!-- Bottom text -->
  <text x="600" y="615" font-family="Inter, Arial, sans-serif" font-weight="400" font-size="12" fill="#64748b" text-anchor="middle">
    Plataforma Oficial de Documentos Digitais da Republica de Angola
  </text>
</svg>
