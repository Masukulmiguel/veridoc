services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: veridoc
      POSTGRES_PASSWORD: veridoc
      POSTGRES_DB: veridoc
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veridoc"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://veridoc:veridoc@db:5432/veridoc
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-troque-este-segredo-em-producao}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      VERIDOC_PUBLIC_URL: ${VERIDOC_PUBLIC_URL:-https://veridoc.ao}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  pgdata:
