[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veridoc-backend"
version = "1.0.0"
description = "Backend FastAPI da VeriDoc — emissão, assinatura e validação de documentos digitais."
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
